<!-- templates/accounts/login.html -->
{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
        <div class="text-center mb-8">
            <!-- Dark mode aware logo -->
            <i class="fas fa-chart-line text-5xl text-blue-600 mb-4"></i>
            <h2 class="text-3xl font-bold text-gray-900">Welcome Back</h2>
            <p class="text-gray-600 mt-2">Login to access your dashboard</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Email Address</label>
                <input type="email" name="email" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Password</label>
                <input type="password" name="password" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                Login
            </button>
        </form>
        
        <p class="text-center text-gray-600 mt-6">
            Don't have an account? 
            <a href="{% url 'accounts:signup' %}" class="text-blue-600 hover:underline">Sign Up</a>
        </p>
        
        <!-- Theme indicator (optional) -->
        <div class="text-center text-xs text-gray-400 mt-4">
            <i class="fas fa-adjust mr-1"></i> Use the moon/sun icon above to switch theme
        </div>
    </div>
</div>
{% endblock %}
